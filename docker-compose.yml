services:
  midi-ai:
    build: .
    image: midi-ai-studio:latest
    container_name: midi-ai
    restart: unless-stopped
    environment:
      MIDI_AI_HOST: "0.0.0.0"
      MIDI_AI_PORT: "8765"
      MIDI_AI_WORKERS: "1"
      MIDI_AI_MAX_PENDING: "6"
      MIDI_AI_TORCH_THREADS: "2"
      MIDI_AI_MAX_DURATION: "300"
    ports:
      - "80:8765"
    # Keep a runaway render from taking the whole host down.
    mem_limit: 1400m
    memswap_limit: 2400m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
